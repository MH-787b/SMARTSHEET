  <title>SMARTSHEET</title>
  <script>
    // GitHub Pages SPA redirect: encode the path as a query param and redirect to index
    var path = window.location.pathname.replace('/SMARTSHEET', '');
    window.location.replace('/SMARTSHEET/?route=' + encodeURIComponent(path));
  </script>
